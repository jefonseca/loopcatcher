name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck appstream desktop-file-utils

      - name: Bash syntax check
        run: bash -n loopcatcher

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic packaging/io.github.jefonseca.loopcatcher.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.jefonseca.loopcatcher.desktop

      - name: ShellCheck (script)
        run: shellcheck loopcatcher

      - name: ShellCheck (tests)
        run: shellcheck -e SC1090,SC2030,SC2031,SC2034,SC2154,SC2317 tests/test.sh

      - name: Run tests
        run: ./tests/test.sh
