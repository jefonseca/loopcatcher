name: Debian package

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: bash -n loopcatcher

      - name: ShellCheck (script)
        run: shellcheck loopcatcher

      - name: ShellCheck (tests)
        run: shellcheck -e SC1090,SC2034,SC2154,SC2317 tests/test.sh

      - name: Run tests
        run: ./tests/test.sh

  build-deb:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dpkg-dev fakeroot devscripts

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist/release dist/metadata
          cp ../*.deb dist/release/
          cp ../*.changes dist/metadata/ || true
          cp ../*.buildinfo dist/metadata/ || true

      - name: Upload release deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: dist/release/

      - name: Upload internal Debian metadata
        uses: actions/upload-artifact@v4
        with:
          name: debian-internal-metadata
          path: dist/metadata/

      - name: Upload to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          files: |
            dist/release/*.deb
